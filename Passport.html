<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Паспорт взломщика</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Меню -->
    <nav class="navbar">
        <ul class="navbar-nav">
            <li><a href="./Passport.html" class="active">Паспорт взломщика</a></li>
            <li><a href="./Location.html">Игровая локация</a></li>
            <li><a href="./Howtohack.html">Способы взлома</a></li>
            <li><a href="./Strangers.html">Прохожие</a></li>
            <li><a href="./form.html">Заказать игрушки</a></li>
            <li><a href="./index.html">Навигация</a></li>
            <li><a href="./algebraic_problem.html">Считаем выручку</a></li>
        </ul>
    </nav>

    <!-- ===== ПАСПОРТ ===== -->
    <div class="passport" style="position: relative; display: flex; justify-content: center; width: 900px; height: 550px; margin: 0 auto; overflow: hidden;">
        <!-- Фото -->
        <img src="passport.jpg" alt="Фото" style="display: block; margin: 0 auto; z-index: 1; position: relative;">
        
        <!-- ТЕКСТ ПОВЕРХ ФОТО -->
        <div class="issued" style="position: absolute; top: 110px; left: 350px; z-index: 2; font-size: 11px; font-family: Arial; color: #222;">
            Отделом УФМС России по г. Москве
        </div>
        <div class="issued" style="position: absolute; top: 125px; left: 300px; z-index: 2; font-size: 11px; font-family: Arial; color: #222;">
            району Басманный
        </div>
        <div class="date_of_issue" style="position: absolute; top: 157px; left: 345px; z-index: 2; font-size: 12px; font-family: Arial; font-weight: bold; color: #222;">
            02.04.2022
        </div>
        <div class="fio" style="position: absolute; top: 310px; left: 430px; z-index: 2; font-size: 16px; font-family: Arial; font-weight: bold; color: #222;">
            Вавилова
        </div>
        <div class="name" style="position: absolute; top: 329px; left: 415px; z-index: 2; font-size: 16px; font-family: Arial; font-weight: bold; color: #222;">
            Мария
        </div>
        <div class="middle_name" style="position: absolute; top: 347px; left: 430px; z-index: 2; font-size: 16px; font-family: Arial; font-weight: bold; color: #222;">
            Антоновна
        </div>
        <div class="gender" style="position: absolute; top: 388px; left: 413px; z-index: 2; font-size: 14px; font-family: Arial; color: #222;">
            Жен
        </div>
        <div class="data_b" style="position: absolute; top: 388px; left: 485px; z-index: 2; font-size: 14px; font-family: Arial; color: #222;">
            14.03.2006
        </div>
    </div>
     <!-- Кнопка вне паспорта -->
    <div style="text-align: center; margin-top: 90px; margin-bottom: 10px;">
        <button id="for_click" class="translate-btn">Перевести на латиницу</button>
    </div>

    <!-- ПОДКЛЮЧАЕМ СКРИПТ В САМОМ КОНЦЕ -->
    <script src="passport_translate.js"></script>
</body>
</html>
